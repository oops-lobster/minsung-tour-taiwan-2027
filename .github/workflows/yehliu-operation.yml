name: Yehliu official operation snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch official RSS snapshot
        run: node scripts/fetch-yehliu-operation.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/yehliu-operation.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/yehliu-operation.json
          git commit -m "chore: refresh Yehliu operation snapshot"
          git push
